name: Fetch storks

# Reads the public Movebank data every three hours and commits data/storks.json
# when it changed. Anonymous: no secrets anywhere. GitHub Pages redeploys on push.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the Nominatim cache
        uses: actions/cache@v4
        with:
          path: tools/work
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: Fetch
        run: python3 tools/fetch.py --days 60

      - name: Commit when changed
        run: |
          git config user.name "storks bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/storks.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
