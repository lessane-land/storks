<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<title>Cigüeñas</title>
<meta name="description" content="Cigüeñas blancas con GPS, en directo, entre Europa y África.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/site.css?v=202611061244">
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<header class="top">
  <h1 class="title"><span data-i18n="title">Cigüeñas</span></h1>
  <p class="tagline" data-i18n="tagline">Cigüeñas blancas con GPS, en directo</p>
</header>

<nav class="tools" aria-label="Opciones">
  <button class="pill" id="lang" type="button" aria-label="Language">EN</button>
  <button class="pill" id="credits-open" type="button" data-i18n="credits">Créditos</button>
</nav>

<section class="birds" id="birds" aria-live="polite"></section>

<section class="year" id="year">
  <p class="year-date" id="year-date"></p>
  <p class="year-span" id="year-span"></p>
  <p class="year-sub" id="year-sub"></p>
  <div class="year-bar" id="year-bar" role="slider" aria-label="Day of the year">
    <span class="year-today" id="year-today"></span>
    <span class="year-head" id="year-head"></span>
  </div>
</section>

<p class="stamp" id="stamp"></p>

<aside class="sheet" id="credits" hidden>
  <div class="sheet-body">
    <button class="pill sheet-close" id="credits-close" type="button" data-i18n="close">Cerrar</button>
    <h2 data-i18n="credits">Créditos</h2>
    <p data-i18n="credits_intro"></p>
    <ul id="credits-studies"></ul>
    <p data-i18n="credits_data"></p>
    <p data-i18n="credits_archive"></p>
    <p data-i18n="credits_map"></p>
    <p class="muted" data-i18n="credits_made"></p>
  </div>
</aside>

<template id="bird-card">
  <article class="bird">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#stork"/></svg>
    <div>
      <h2 class="name"></h2>
      <p class="where"></p>
      <p class="bio"></p>
      <p class="meta"></p>
    </div>
  </article>
</template>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="stork" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"
        d="M2.5 17.5 L8.5 12.6 L21.5 8.4 M18.5 9.3 L21.5 8.4 M9.5 12.3 C8.2 9 5.8 6.4 2.5 5.2 M11.8 11.6 C12.6 8 15 5.2 18.5 3.8 M8.5 12.6 L5.6 14.6"/>
    </symbol>
  </defs>
</svg>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/i18n.js?v=202611061244"></script>
<script src="js/flow.js?v=202611061244"></script>
<script src="js/app.js?v=202611061244"></script>
</body>
</html>
